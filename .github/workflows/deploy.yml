name: Deploy Telegram Bot to Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: supabase-deploy-telegram
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Edge Function
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy 'telegram' function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy telegram \
            --remote=${{ vars.SUPABASE_PROJECT_REF }} \
            --no-verify-jwt \
            --use-api \
            --yes

      - name: Confirm webhook is registered
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          curl -sS -o /dev/null -w "function status: %{http_code}\n" \
            "https://${{ vars.SUPABASE_PROJECT_REF }}.functions.supabase.co/telegram"